<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Game Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* Hiệu ứng nền động nhẹ nhàng */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(138, 43, 226, 0.2);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 1;
            animation: float 6s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(-20px) scale(1); }
            100% { transform: translateY(20px) scale(1.1); }
        }

        /* Container chính của Menu */
        .menu-container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(252, 0, 255, 0.3);
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 30px;
        }

        /* Danh sách nút bấm */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 220px;
            margin: 0 auto;
        }

        .btn {
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background: linear-gradient(45deg, #00dbde, #fc00ff);
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(252, 0, 255, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Khu vực hiển thị màn hình game (Ẩn mặc định) */
        #game-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #game-screen h2 {
            margin-bottom: 20px;
            color: #00dbde;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            background: #ff4757;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .back-btn:hover {
            background: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- Màn hình Menu chính -->
    <div class="menu-container" id="main-menu">
        <h1>GAME CỦA TÔI</h1>
        <p class="subtitle">HTML5 Web Game Project</p>
        <div class="menu-buttons">
            <button class="btn" onclick="startGame()">Chơi Ngay</button>
            <button class="btn" onclick="openSettings()">Cài Đặt</button>
            <button class="btn" onclick="openCredits()">Thông Tin</button>
        </div>
    </div>

    <!-- Màn hình Game (Sẽ bật lên khi bấm Chơi) -->
    <div id="game-screen">
        <button class="back-btn" onclick="returnToMenu()">⬅ Thoát</button>
        <h2>Khu vực Game chạy ở đây</h2>
        <canvas id="gameCanvas" width="800" height="450" style="background: #222; border: 2px solid #555; border-radius: 8px;"></canvas>
    </div>

    <script>
        const mainMenu = document.getElementById('main-menu');
        const gameScreen = document.getElementById('game-screen');

        function startGame() {
            mainMenu.style.display = 'none';
            gameScreen.style.display = 'flex';
            
            // Khởi tạo game hoặc vẽ lên canvas ở đây sau này
            initGameCanvas();
        }

        function returnToMenu() {
            gameScreen.style.display = 'none';
            mainMenu.style.display = 'block';
        }

        function openSettings() {
            alert("Tính năng cài đặt đang phát triển!");
        }

        function openCredits() {
            alert("Được làm bởi bạn với HTML/CSS/JS!");
        }

        function initGameCanvas() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // Vẽ mẫu một khung hình đơn giản
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00dbde';
            ctx.font = '24px Arial';
            ctx.fillText("Sẵn sàng viết code game vào đây!", 200, 225);
        }
    </script>
</body>
</html>
