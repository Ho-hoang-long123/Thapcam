<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mạng Xã Hội</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

  <!-- ĐĂNG NHẬP -->
  <div id="auth" class="flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-2xl w-96 border border-gray-700">
      <h2 class="text-2xl font-bold text-center text-indigo-400 mb-2">Đăng nhập / Đăng ký</h2>
      <p class="text-sm text-gray-400 text-center mb-6">Nhập tên tài khoản và mật khẩu</p>
      <form id="authForm" class="space-y-4">
        <input type="text" id="username" placeholder="Tên tài khoản" required
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-2 focus:ring-indigo-500">
        <input type="password" id="password" placeholder="Mật khẩu" required
          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:ring-2 focus:ring-indigo-500">
        <div id="error" class="text-red-400 text-sm hidden"></div>
        <button class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold">Tiếp tục</button>
      </form>
    </div>
  </div>

  <!-- TRANG CHÍNH -->
  <div id="app" class="hidden min-h-screen bg-gray-100 text-gray-900 flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow px-4 py-3 flex justify-between items-center flex-wrap gap-2">
      <div class="flex items-center gap-3">
        <img id="headerAvatar" src="https://via.placeholder.com/150" class="w-9 h-9 rounded-full object-cover border">
        <span class="font-bold text-indigo-600">Xin chào, <span id="userName"></span></span>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button onclick="tab('home')" id="btn-home" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm">Bảng tin</button>
        <button onclick="tab('search')" id="btn-search" class="px-3 py-1.5 bg-gray-200 rounded-lg text-sm">Tìm bạn</button>
        <button onclick="tab('chat')" id="btn-chat" class="px-3 py-1.5 bg-gray-200 rounded-lg text-sm">Tin nhắn</button>
        <button onclick="tab('settings')" id="btn-settings" class="px-3 py-1.5 bg-gray-200 rounded-lg text-sm">Cài đặt</button>
      </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto p-4">

      <!-- Bảng tin -->
      <div id="page-home">
        <div class="bg-white p-5 rounded-xl shadow">
          <h2 class="font-bold text-lg mb-2">Bảng tin</h2>
          <p class="text-gray-600">Chào mừng bạn đã đăng nhập thành công!</p>
        </div>
      </div>

      <!-- Tìm bạn -->
      <div id="page-search" class="hidden space-y-4">
        <div class="bg-white p-5 rounded-xl shadow">
          <h2 class="font-bold text-lg mb-3">Tìm kiếm người dùng</h2>
          <div class="flex gap-2">
            <input id="searchInput" placeholder="Nhập tên..." class="flex-1 px-3 py-2 border rounded-lg">
            <button onclick="searchUser()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">Tìm</button>
          </div>
          <div id="searchResult" class="mt-4 space-y-2"></div>
        </div>

        <div class="bg-white p-5 rounded-xl shadow">
          <h2 class="font-bold text-lg mb-3">Lời mời kết bạn</h2>
          <div id="requestList" class="space-y-2 text-sm text-gray-500">Không có lời mời</div>
        </div>

        <div class="bg-white p-5 rounded-xl shadow">
          <h2 class="font-bold text-lg mb-3">Bạn bè</h2>
          <div id="friendList" class="space-y-2 text-sm text-gray-500">Chưa có bạn bè</div>
        </div>
      </div>

      <!-- Tin nhắn (giao diện đơn giản) -->
      <div id="page-chat" class="hidden">
        <div class="bg-white rounded-xl shadow overflow-hidden" style="height:580px">
          <!-- Chọn bạn -->
          <div class="p-3 border-b bg-gray-50 flex gap-2 items-center">
            <select id="friendSelect" onchange="startChat()" class="flex-1 px-3 py-2 border rounded-lg text-sm">
              <option value="">-- Chọn bạn để chat --</option>
            </select>
          </div>

          <!-- Tin nhắn -->
          <div id="chatBox" class="h-[420px] overflow-y-auto p-4 space-y-3 bg-gray-50 text-sm">
            <p class="text-center text-gray-400 mt-16">Chọn bạn ở trên để bắt đầu nhắn tin</p>
          </div>

          <!-- Gửi tin -->
          <div class="p-3 border-t flex gap-2">
            <input id="msgInput" placeholder="Nhập tin nhắn..." class="flex-1 px-3 py-2 border rounded-full text-sm"
              onkeypress="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()" class="px-4 py-2 bg-indigo-600 text-white rounded-full text-sm">Gửi</button>
          </div>
        </div>
      </div>

      <!-- Cài đặt -->
      <div id="page-settings" class="hidden">
        <div class="bg-white p-6 rounded-xl shadow max-w-sm mx-auto space-y-5">
          <h2 class="font-bold text-xl text-center">Cài đặt</h2>
          <div class="flex flex-col items-center gap-3">
            <img id="setAvatar" src="https://via.placeholder.com/150" class="w-20 h-20 rounded-full object-cover border-2 border-indigo-500">
            <label class="cursor-pointer bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg text-sm">
              Đổi ảnh đại diện
              <input type="file" id="avatarInput" accept="image/*" class="hidden">
            </label>
          </div>
          <button onclick="logout()" class="w-full py-2.5 bg-red-600 text-white rounded-lg font-semibold">Đăng xuất</button>
        </div>
      </div>

    </main>
  </div>

<script>
const SUPABASE_URL = 'https://qcgwmdsreduajcruktgm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QUA03gl4gHRsj1r95UPtTg_2fUvKIvF';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let user = null;
let chatWith = null;
let timer = null;

// ===== AUTH =====
const saved = localStorage.getItem('user');
if (saved) {
  user = JSON.parse(saved);
  showApp();
}

document.getElementById('authForm').onsubmit = async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim().toLowerCase();
  const password = document.getElementById('password').value.trim();
  const err = document.getElementById('error');
  err.classList.add('hidden');

  try {
    let { data } = await sb.from('profiles').select('*').eq('username', username).maybeSingle();

    if (data) {
      if (data.password !== password) {
        err.textContent = 'Sai mật khẩu';
        err.classList.remove('hidden');
        return;
      }
      user = data;
    } else {
      const { data: newUser, error } = await sb.from('profiles')
        .insert([{ username, password, avatar_url: null }]).select().single();
      if (error) throw error;
      user = newUser;
    }

    localStorage.setItem('user', JSON.stringify(user));
    showApp();
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  }
};

function showApp() {
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userName').textContent = user.username;
  const av = user.avatar_url || 'https://via.placeholder.com/150';
  document.getElementById('headerAvatar').src = av;
  document.getElementById('setAvatar').src = av;
  loadRequests();
  loadFriends();
}

function logout() {
  clearInterval(timer);
  localStorage.removeItem('user');
  location.reload();
}

// ===== TAB =====
function tab(name) {
  ['home','search','chat','settings'].forEach(p => {
    document.getElementById('page-' + p).classList.add('hidden');
    document.getElementById('btn-' + p).className = 'px-3 py-1.5 bg-gray-200 rounded-lg text-sm';
  });
  document.getElementById('page-' + name).classList.remove('hidden');
  document.getElementById('btn-' + name).className = 'px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-sm';

  if (name === 'chat') loadChatFriends();
  if (name !== 'chat') clearInterval(timer);
}

// ===== BẠN BÈ =====
async function searchUser() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const box = document.getElementById('searchResult');
  if (!q) return;

  const { data } = await sb.from('profiles').select('*').ilike('username', `%${q}%`).neq('id', user.id);
  if (!data?.length) {
    box.innerHTML = '<p class="text-gray-500 text-sm">Không tìm thấy</p>';
    return;
  }
  box.innerHTML = data.map(u => `
    <div class="flex justify-between items-center p-2 border rounded-lg">
      <div class="flex items-center gap-2">
        <img src="${u.avatar_url || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full">
        <span class="font-medium">${u.username}</span>
      </div>
      <button onclick="addFriend('${u.id}')" class="px-3 py-1 bg-indigo-600 text-white text-xs rounded-lg">Kết bạn</button>
    </div>
  `).join('');
}

async function addFriend(id) {
  const { error } = await sb.from('friend_requests').insert([{ sender_id: user.id, receiver_id: id, status: 'pending' }]);
  alert(error ? 'Đã gửi rồi hoặc lỗi' : 'Đã gửi lời mời!');
}

async function loadRequests() {
  const box = document.getElementById('requestList');
  const { data } = await sb.from('friend_requests').select('id, sender_id').eq('receiver_id', user.id).eq('status', 'pending');
  if (!data?.length) {
    box.innerHTML = '<p class="text-gray-500">Không có lời mời</p>';
    return;
  }
  box.innerHTML = '';
  for (const r of data) {
    const { data: s } = await sb.from('profiles').select('username, avatar_url').eq('id', r.sender_id).single();
    if (s) {
      box.innerHTML += `
        <div class="flex justify-between items-center p-2 border rounded-lg">
          <div class="flex items-center gap-2">
            <img src="${s.avatar_url || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full">
            <span>${s.username}</span>
          </div>
          <div class="flex gap-1">
            <button onclick="reply('${r.id}','accepted')" class="px-2 py-1 bg-green-600 text-white text-xs rounded">Đồng ý</button>
            <button onclick="reply('${r.id}','rejected')" class="px-2 py-1 bg-red-600 text-white text-xs rounded">Xóa</button>
          </div>
        </div>`;
    }
  }
}

async function reply(id, status) {
  await sb.from('friend_requests').update({ status }).eq('id', id);
  loadRequests();
  loadFriends();
}

async function loadFriends() {
  const box = document.getElementById('friendList');
  const { data } = await sb.from('friend_requests')
    .select('sender_id, receiver_id')
    .eq('status', 'accepted')
    .or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`);

  if (!data?.length) {
    box.innerHTML = '<p class="text-gray-500">Chưa có bạn bè</p>';
    return;
  }
  box.innerHTML = '';
  for (const r of data) {
    const fid = r.sender_id === user.id ? r.receiver_id : r.sender_id;
    const { data: f } = await sb.from('profiles').select('username, avatar_url').eq('id', fid).single();
    if (f) {
      box.innerHTML += `
        <div class="flex items-center gap-2 p-2 border rounded-lg">
          <img src="${f.avatar_url || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full">
          <span class="font-medium">${f.username}</span>
          <span class="ml-auto text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">Bạn bè</span>
        </div>`;
    }
  }
}

// ===== CHAT (đơn giản) =====
async function loadChatFriends() {
  const sel = document.getElementById('friendSelect');
  sel.innerHTML = '<option value="">-- Chọn bạn để chat --</option>';

  const { data } = await sb.from('friend_requests')
    .select('sender_id, receiver_id')
    .eq('status', 'accepted')
    .or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`);

  if (!data) return;

  for (const r of data) {
    const fid = r.sender_id === user.id ? r.receiver_id : r.sender_id;
    const { data: f } = await sb.from('profiles').select('id, username').eq('id', fid).single();
    if (f) {
      const opt = document.createElement('option');
      opt.value = f.id;
      opt.textContent = f.username;
      sel.appendChild(opt);
    }
  }
}

function startChat() {
  const sel = document.getElementById('friendSelect');
  chatWith = sel.value || null;
  if (!chatWith) {
    document.getElementById('chatBox').innerHTML = '<p class="text-center text-gray-400 mt-16">Chọn bạn ở trên để bắt đầu nhắn tin</p>';
    clearInterval(timer);
    return;
  }
  loadMsg();
  clearInterval(timer);
  timer = setInterval(loadMsg, 2500);
}

async function loadMsg() {
  if (!chatWith) return;
  const box = document.getElementById('chatBox');

  const { data, error } = await sb.from('messages')
    .select('*')
    .or(`and(sender_id.eq.${user.id},receiver_id.eq.${chatWith}),and(sender_id.eq.${chatWith},receiver_id.eq.${user.id})`)
    .order('created_at', { ascending: true });

  if (error) {
    box.innerHTML = '<p class="text-center text-red-500 mt-10">Lỗi tải tin nhắn (kiểm tra bảng messages)</p>';
    return;
  }

  if (!data?.length) {
    box.innerHTML = '<p class="text-center text-gray-400 mt-16">Chưa có tin nhắn. Hãy gửi lời chào!</p>';
    return;
  }

  box.innerHTML = data.map(m => {
    const mine = m.sender_id === user.id;
    const time = new Date(m.created_at).toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
    return `
      <div class="flex ${mine ? 'justify-end' : 'justify-start'}">
        <div class="max-w-[75%] px-3 py-2 rounded-2xl text-sm ${mine ? 'bg-indigo-600 text-white' : 'bg-white border'}">
          <p class="break-words">${esc(m.content)}</p>
          <p class="text-[10px] ${mine ? 'text-indigo-200' : 'text-gray-400'} text-right mt-0.5">${time}</p>
        </div>
      </div>`;
  }).join('');

  box.scrollTop = box.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !chatWith) return;
  input.value = '';

  const { error } = await sb.from('messages').insert([{
    sender_id: user.id,
    receiver_id: chatWith,
    content: text
  }]);

  if (error) {
    alert('Lỗi gửi tin: ' + error.message);
    input.value = text;
  } else {
    loadMsg();
  }
}

function esc(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

// ===== AVATAR =====
document.getElementById('avatarInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const img = new Image();
    img.src = ev.target.result;
    img.onload = async () => {
      const canvas = document.createElement('canvas');
      const size = 200;
      let w = img.width, h = img.height;
      if (w > h) { h = h * size / w; w = size; } else { w = w * size / h; h = size; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const b64 = canvas.toDataURL('image/jpeg', 0.7);

      await sb.from('profiles').update({ avatar_url: b64 }).eq('id', user.id);
      user.avatar_url = b64;
      localStorage.setItem('user', JSON.stringify(user));
      document.getElementById('headerAvatar').src = b64;
