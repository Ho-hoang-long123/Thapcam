<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat Supabase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col">

    <!-- KHUNG ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h1 id="auth-title" class="text-2xl font-bold mb-6 text-center text-blue-600">Đăng Nhập ChatApp</h1>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Tên tài khoản (Username)</label>
                    <input type="text" id="username" placeholder="Nhập tên của bạn..." class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu..." class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button onclick="handleAuth()" id="auth-btn" class="w-full bg-blue-600 text-white p-2 rounded-lg font-semibold hover:bg-blue-700 transition">Đăng Nhập</button>
                <p class="text-center text-sm text-gray-600">
                    <span id="auth-switch-text">Chưa có tài khoản?</span> 
                    <button onclick="toggleAuthMode()" id="auth-switch-btn" class="text-blue-600 font-semibold hover:underline">Đăng ký ngay</button>
                </p>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH (SAU KHI ĐĂNG NHẬP) -->
    <div id="chat-screen" class="hidden flex-1 flex overflow-hidden">
        <!-- Sidebar danh sách người dùng -->
        <div class="w-1/3 bg-white border-r flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <div>
                    <h2 id="current-user-name" class="font-bold text-gray-800">Đang tải...</h2>
                    <span class="text-xs text-green-500 font-medium">● Online</span>
                </div>
                <button onclick="logout()" class="text-sm text-red-500 hover:underline">Đăng xuất</button>
            </div>
            
            <div class="p-3 border-b">
                <input type="text" id="search-user" placeholder="Tìm kiếm người dùng..." class="w-full p-2 text-sm border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div id="users-list" class="flex-1 overflow-y-auto divide-y">
                <!-- Danh sách user render ở đây -->
            </div>
        </div>

        <!-- Khung chat chi tiết -->
        <div class="flex-2 flex flex-col bg-slate-50 flex-1">
            <div id="chat-header" class="p-4 bg-white border-b font-bold text-gray-700">
                Chọn một người bạn để bắt đầu nhắn tin
            </div>

            <!-- Khung chứa tin nhắn -->
            <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col">
                <div class="text-center text-gray-400 my-auto">Chưa có cuộc trò chuyện nào được chọn.</div>
            </div>

            <!-- Khung nhập nội dung -->
            <div id="chat-input-box" class="p-4 bg-white border-t hidden flex items-center space-x-2">
                <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 p-2.5 rounded-lg text-gray-600 transition">
                    📁
                    <input type="file" id="media-file" accept="image/*,video/*" class="hidden" onchange="previewMedia()">
                </label>
                <span id="file-name" class="text-xs text-blue-600 truncate max-w-[100px]"></span>
                <input type="text" id="message-input" placeholder="Nhập tin nhắn..." class="flex-1 p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Gửi</button>
            </div>
        </div>
    </div>

    <!-- Script xử lý -->
    <script>
        // THAY THẾ THÔNG TIN SUPABASE CỦA BẠN VÀO ĐÂY
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let activeReceiver = null;
        let isSignUpMode = false;
        let selectedFile = null;
        let currentSubscription = null;

        // Kiểm tra phiên đăng nhập
        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                showChatScreen();
            }
        }
        checkUser();

        // Chuyển chế độ Đăng nhập <-> Đăng ký
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? 'Đăng Ký Tài Khoản' : 'Đăng Nhập ChatApp';
            document.getElementById('auth-btn').innerText = isSignUpMode ? 'Đăng Ký' : 'Đăng Nhập';
            document.getElementById('auth-switch-text').innerText = isSignUpMode ? 'Đã có tài khoản?' : 'Chưa có tài khoản?';
            document.getElementById('auth-switch-btn').innerText = isSignUpMode ? 'Đăng nhập ngay' : 'Đăng ký ngay';
        }

        // Biến đổi tên thành email giả lập hệ thống (VD: "namcute" -> "namcute@chatapp.local")
        function getFakeEmail(username) {
            return `${username.trim().toLowerCase().replace(/\s+/g, '')}@chatapp.local`;
        }

        // Xử lý xác thực (Auth) chỉ dùng Username và Password
        async function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) return alert('Vui lòng điền đầy đủ tên và mật khẩu!');

            const fakeEmail = getFakeEmail(username);

            if (isSignUpMode) {
                // Đăng ký tài khoản
                const { data, error } = await supabaseClient.auth.signUp({ 
                    email: fakeEmail, 
                    password: password 
                });
                
                if (error) return alert('Lỗi đăng ký: ' + error.message);

                if (data.user) {
                    // Lưu thông tin profile vào bảng profiles
                    const { error: profileError } = await supabaseClient.from('profiles').insert([{ 
                        id: data.user.id, 
                        username: username 
                    }]);
                    
                    if (profileError) {
                        alert('Lỗi tạo profile: ' + profileError.message);
                        return;
                    }
                    alert('Đăng ký thành công! Hãy chuyển sang Đăng nhập.');
                    toggleAuthMode();
                }
            } else {
                // Đăng nhập tài khoản
                const { data, error } = await supabaseClient.auth.signInWithPassword({ 
                    email: fakeEmail, 
                    password: password 
                });
                
                if (error) return alert('Sai tên tài khoản hoặc mật khẩu!');
                currentUser = data.user;
                showChatScreen();
            }
        }

        // Đăng xuất
        async function logout() {
            if (currentSubscription) supabaseClient.removeChannel(currentSubscription);
            await supabaseClient.auth.signOut();
            currentUser = null;
            activeReceiver = null;
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        // Hiển thị giao diện chat chính
        async function showChatScreen() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');

            const { data } = await supabaseClient.from('profiles').select('username').eq('id', currentUser.id).single();
            document.getElementById('current-user-name').innerText = data ? data.username : 'Người dùng';

            loadUsers();
        }

        // Lấy danh sách người dùng khác
        async function loadUsers() {
            const { data, error } = await supabaseClient.from('profiles').select('*').neq('id', currentUser.id);
            if (error) return;

            const listEl = document.getElementById('users-list');
            listEl.innerHTML = '';

            if (!data || data.length === 0) {
                listEl.innerHTML = '<div class="p-4 text-center text-gray-400 text-sm">Chưa có người dùng nào khác.</div>';
                return;
            }

            data.forEach(user => {
                const div = document.createElement('div');
                div.className = 'p-3 hover:bg-gray-100 cursor-pointer flex items-center space-x-3 transition';
                div.innerHTML = `
                    <div class="w-10 h-10 bg-blue-500 text-white rounded-full flex items-center justify-center font-bold">
                        ${user.username ? user.username.charAt(0).toUpperCase() : 'U'}
                    </div>
                    <div>
                        <div class="font-semibold text-gray-800">${user.username || 'Không tên'}</div>
                        <div class="text-xs text-gray-400">Nhấn để nhắn tin</div>
                    </div>
                `;
                div.onclick = () => selectReceiver(user);
                listEl.appendChild(div);
            });
        }

        // Chọn người nhận tin nhắn
        function selectReceiver(user) {
            activeReceiver = user;
            document.getElementById('chat-header').innerText = `Đang chat với: ${user.username}`;
            document.getElementById('chat-input-box').classList.remove('hidden');
            loadMessages();
            subscribeToMessages();
        }

        // Tải lịch sử tin nhắn
        async function loadMessages() {
            if (!activeReceiver) return;

            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeReceiver.id}),and(sender_id.eq.${activeReceiver.id},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });

            if (error) return;

            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            data.forEach(msg => appendMessage(msg));
            container.scrollTop = container.scrollHeight;
        }

        // Thêm một tin nhắn vào khung hiển thị
        function appendMessage(msg) {
            const container = document.getElementById('messages-container');
            const isMe = msg.sender_id === currentUser.id;

            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

            let mediaHTML = '';
            if (msg.media_url) {
                if (msg.media_type === 'image') {
                    mediaHTML = `<img src="${msg.media_url}" class="max-w-xs rounded-lg mt-1 mb-1 shadow">`;
                } else if (msg.media_type === 'video') {
                    mediaHTML = `<video src="${msg.media_url}" controls class="max-w-xs rounded-lg mt-1 mb-1 shadow"></video>`;
                }
            }

            div.innerHTML = `
                <div class="max-w-md px-4 py-2 rounded-2xl text-sm ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-200 text-gray-800 rounded-bl-none'}">
                    ${msg.content ? `<span>${escapeHtml(msg.content)}</span>` : ''}
                    ${mediaHTML}
                </div>
                <span class="text-[10px] text-gray-400 mt-1">${new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Lắng nghe realtime tin nhắn mới
        function subscribeToMessages() {
            if (currentSubscription) {
                supabaseClient.removeChannel(currentSubscription);
            }

            currentSubscription = supabaseClient
                .channel('public:messages')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'messages' 
                }, payload => {
                    const msg = payload.new;
                    if (
                        activeReceiver && 
                        ((msg.sender_id === currentUser.id && msg.receiver_id === activeReceiver.id) ||
                         (msg.sender_id === activeReceiver.id && msg.receiver_id === currentUser.id))
                    ) {
                        appendMessage(msg);
                    }
                })
                .subscribe();
        }

        // Xem trước tên file chọn tải lên
        function previewMedia() {
            const fileInput = document.getElementById('media-file');
            selectedFile = fileInput.files[0];
            if (selectedFile) {
                document.getElementById('file-name').innerText = selectedFile.name;
            }
        }

        // Gửi tin nhắn (Văn bản hoặc Ảnh/Video)
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();

            if (!content && !selectedFile) return;
            if (!activeReceiver) return;

            let media_url = null;
            let media_type = null;

            if (selectedFile) {
                const fileExt = selectedFile.name.split('.').pop();
                const fileName = `${Math.random().toString(36).substring(2)}.${fileExt}`;
                const filePath = `${currentUser.id}/${fileName}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('chat-media')
                    .upload(filePath, selectedFile);

                if (uploadError) {
                    alert('Lỗi tải file lên: ' + uploadError.message);
                    return;
                }

                const { data: publicUrlData } = supabaseClient.storage
                    .from('chat-media')
                    .getPublicUrl(filePath);

                media_url = publicUrlData.publicUrl;
                media_type = selectedFile.type.startsWith('image/') ? 'image' : 'video';

                selectedFile = null;
                document.getElementById('media-file').value = '';
                document.getElementById('file-name').innerText = '';
            }

            const { error } = await supabaseClient.from('messages').insert([
                {
                    sender_id: currentUser.id,
                    receiver_id: activeReceiver.id,
                    content: content || null,
                    media_url,
                    media_type
                }
            ]);

            if (error) {
                alert('Lỗi gửi tin nhắn: ' + error.message);
            } else {
                input.value = '';
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
