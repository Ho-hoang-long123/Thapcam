<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thập Cẩm Network</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: none; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #1877f2; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #166fe5; }
        .post-item { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .post-author { font-weight: bold; color: #050505; }
        .post-time { font-size: 11px; color: #65676b; margin-top: 3px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Thập Cẩm Network 🚀</h2>

    <!-- Khung đăng bài -->
    <div class="card">
        <h3>Đăng trạng thái mới</h3>
        <input type="text" id="authorInput" placeholder="Tên của bạn...">
        <textarea id="contentInput" placeholder="Bạn đang nghĩ gì thế?"></textarea>
        <button onclick="dangBai()">Đăng bài</button>
    </div>

    <!-- Bảng hiển thị bài viết -->
    <div class="card">
        <h3>Bảng tin</h3>
        <div id="feed">Đang tải bài viết...</div>
    </div>
</div>

<!-- Nhúng thư viện Supabase từ CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Cấu hình Supabase của bạn
    const SUPABASE_URL = 'https://qcgwmdsreduajcruktgm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjZ3dtZHNyZWR1YWpjcnVrdGgmInJvbGUiOiJhbm9uIiwiaWF0IjoxNzkwNjYwMjI5LCJleHAiOjIxMDYyMzYyMjl9.GwpOaWOacqmHF2SwMDas2efp_w4-mFLoWMc_DlZUUe8';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 1. Hàm đăng bài lên Supabase
    async function dangBai() {
        const author = document.getElementById('authorInput').value.trim();
        const content = document.getElementById('contentInput').value.trim();

        if (!author || !content) {
            alert('Vui lòng nhập tên và nội dung!');
            return;
        }

        const { error } = await _supabase
            .from('posts')
            .insert([{ author: author, content: content }]);

        if (error) {
            alert('Lỗi khi đăng: ' + error.message);
        } else {
            document.getElementById('contentInput').value = ''; // Xóa ô nội dung
            layBaiViet(); // Tải lại danh sách
        }
    }

    // 2. Hàm lấy tất cả bài viết từ Supabase hiển thị lên web
    async function layBaiViet() {
        const { data, error } = await _supabase
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false }); // Lấy bài mới nhất lên trên

        const feedDiv = document.getElementById('feed');
        if (error) {
            feedDiv.innerHTML = 'Lỗi tải dữ liệu: ' + error.message;
            return;
        }

        if (!data || data.length === 0) {
            feedDiv.innerHTML = 'Chưa có bài viết nào. Hãy là người đầu tiên đăng bài!';
            return;
        }

        let html = '';
        data.forEach(post => {
            let timeStr = post.created_at ? new Date(post.created_at).toLocaleString('vi-VN') : '';
            html += `
                <div class="post-item">
                    <div class="post-author">${escapeHtml(post.author)}</div>
                    <div style="margin-top: 5px;">${escapeHtml(post.content)}</div>
                    <div class="post-time">${timeStr}</div>
                </div>
            `;
        });
        feedDiv.innerHTML = html;
    }

    // Hàm chống lỗi bảo mật hiển thị ký tự HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Tự động tải bài viết khi vừa mở web
    layBaiViet();
</script>

</body>
</html>
