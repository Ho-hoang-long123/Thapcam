<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalo Web - Kết Bạn & Nhắn Tin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden">

    <!-- Auth Container -->
    <div id="auth-container" class="flex items-center justify-center h-screen bg-gradient-to-br from-blue-500 to-blue-700">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96 max-w-full mx-4">
            <div class="text-center mb-6">
                <div class="inline-block bg-blue-600 text-white font-bold text-2xl px-4 py-2 rounded-lg mb-2 shadow">ZALO</div>
                <h1 class="text-xl font-bold text-gray-800" id="auth-title">Đăng nhập tài khoản</h1>
            </div>
            
            <div id="auth-error" class="hidden bg-red-100 border border-red-400 text-red-700 px-3 py-2 rounded mb-4 text-sm"></div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div id="name-field" class="mb-4 hidden">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Tên hiển thị</label>
                    <input type="text" id="auth-name" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ví dụ: Nguyễn Văn A">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Tên đăng nhập</label>
                    <input type="text" id="auth-username" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nhập tên đăng nhập">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Mật khẩu</label>
                    <input type="password" id="auth-password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nhập mật khẩu">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition">Đăng Nhập</button>
            </form>

            <div class="mt-4 text-center">
                <button onclick="toggleAuthMode()" id="auth-switch" class="text-sm text-blue-600 hover:underline">Chưa có tài khoản? Đăng ký ngay</button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="hidden flex h-screen">
        <!-- Sidebar Navigation -->
        <div class="w-16 bg-blue-600 flex flex-col items-center py-4 justify-between text-white flex-shrink-0">
            <div class="flex flex-col items-center space-y-4">
                <div class="w-10 h-10 rounded-full bg-white text-blue-600 flex items-center justify-center font-bold text-lg shadow mb-2" id="user-initial">Z</div>
                <button onclick="switchTab('chats')" id="nav-chats" title="Tin nhắn" class="w-10 h-10 rounded-lg bg-blue-700 flex items-center justify-center text-xl transition"><i class="fa-solid fa-message"></i></button>
                <button onclick="switchTab('contacts')" id="nav-contacts" title="Danh bạ & Kết bạn" class="w-10 h-10 rounded-lg hover:bg-blue-700 flex items-center justify-center text-xl transition"><i class="fa-solid fa-address-book"></i></button>
            </div>
            <div>
                <button onclick="logout()" title="Đăng xuất" class="w-10 h-10 rounded-lg hover:bg-red-600 flex items-center justify-center text-xl text-blue-200 hover:text-white transition"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>

        <!-- Sidebar Left Content Area (Thay đổi theo Tab) -->
        <div class="w-80 bg-white border-r flex flex-col flex-shrink-0">
            <div class="p-3 border-b flex items-center justify-between">
                <h2 class="font-bold text-gray-800 text-base truncate" id="my-profile-name">Đang tải...</h2>
            </div>

            <!-- TAB 1: TIN NHẮN -->
            <div id="tab-chats-content" class="flex-1 flex flex-col overflow-hidden">
                <div class="p-3 border-b text-xs font-bold text-gray-400 uppercase bg-gray-50">Danh sách trò chuyện (Đã kết bạn)</div>
                <div class="flex-1 overflow-y-auto" id="chat-list"></div>
            </div>

            <!-- TAB 2: DANH BẠ & KẾT BẠN -->
            <div id="tab-contacts-content" class="hidden flex-1 flex flex-col overflow-hidden">
                <div class="p-3 border-b bg-gray-50">
                    <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Tìm kiếm người dùng</h3>
                    <div class="flex items-center space-x-1">
                        <input type="text" id="search-user-input" placeholder="Nhập tên đăng nhập..." class="flex-1 px-3 py-1.5 border rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <button onclick="searchUser()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm hover:bg-blue-700"><i class="fa-solid fa-search"></i></button>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto p-3 space-y-4" id="contacts-container">
                    <!-- Lời mời kết bạn & Kết quả tìm kiếm -->
                </div>
            </div>
        </div>

        <!-- Right Main Content Area -->
        <div class="flex-1 flex flex-col bg-white">
            <div class="flex-1 flex items-center justify-center text-gray-400 bg-gray-50" id="no-chat-selected">
                <div class="text-center">
                    <i class="fa-regular fa-comments text-5xl mb-3"></i>
                    <p>Chọn một cuộc trò chuyện để bắt đầu nhắn tin</p>
                </div>
            </div>

            <!-- Active Chat Box -->
            <div id="active-chat" class="hidden flex-1 flex flex-col h-full">
                <div class="p-3 border-b flex items-center justify-between bg-white shadow-sm">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold" id="current-chat-avatar">U</div>
                        <div>
                            <h3 class="font-bold text-gray-800" id="current-chat-name">Tên Người Nhận</h3>
                            <span class="text-xs text-green-500">Đã là bạn bè</span>
                        </div>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50" id="message-container"></div>

                <div class="p-3 border-t bg-white flex items-center space-x-2">
                    <input type="text" id="message-input" placeholder="Nhập tin nhắn..." class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-1 focus:ring-blue-500 text-sm" onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qcgwmdsreduajcruktgm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjZ3dtZHNyZWR1YWpjcnVrdGdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjAyMjksImV4cCI6MjEwNjIzNjIyOX0.GwpOaWOacqmHF2SwMDas2efp_w4-mFLoWMc_DlZUUe8";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isSignUp = false;
        let currentUser = null;
        let currentRecipient = null;
        let messageSubscription = null;
        let requestSubscription = null;

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? 'Đăng ký tài khoản mới' : 'Đăng nhập tài khoản';
            document.getElementById('auth-btn').innerText = isSignUp ? 'Đăng Ký' : 'Đăng Nhập';
            document.getElementById('auth-switch').innerText = isSignUp ? 'Đã có tài khoản? Đăng nhập' : 'Chưa có tài khoản? Đăng ký ngay';
            document.getElementById('name-field').classList.toggle('hidden', !isSignUp);
            document.getElementById('auth-error').classList.add('hidden');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;
            const displayName = document.getElementById('auth-name').value.trim();
            const errorDiv = document.getElementById('auth-error');
            errorDiv.classList.add('hidden');

            try {
                if (isSignUp) {
                    if (!displayName) throw new Error('Vui lòng nhập tên hiển thị!');
                    const { data: existing } = await supabaseClient.from('custom_users').select('*').eq('username', username).single();
                    if (existing) throw new Error('Tên đăng nhập đã tồn tại!');

                    const { error } = await supabaseClient.from('custom_users').insert({ username, display_name: displayName, password });
                    if (error) throw error;
                    alert('Đăng ký thành công! Hãy đăng nhập ngay.');
                    toggleAuthMode();
                } else {
                    const { data, error } = await supabaseClient.from('custom_users').select('*').eq('username', username).eq('password', password).single();
                    if (error || !data) throw new Error('Sai tên đăng nhập hoặc mật khẩu!');
                    currentUser = data;
                    localStorage.setItem('zalo_user', JSON.stringify(currentUser));
                    checkUserSession();
                }
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.classList.remove('hidden');
            }
        }

        function checkUserSession() {
            const savedUser = localStorage.getItem('zalo_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('user-initial').innerText = currentUser.display_name.charAt(0).toUpperCase();
                document.getElementById('my-profile-name').innerText = currentUser.display_name;
                loadChats();
                loadContactsData();
                initRealtime();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('zalo_user');
            location.reload();
        }

        function switchTab(tab) {
            const chatsTab = document.getElementById('tab-chats-content');
            const contactsTab = document.getElementById('tab-contacts-content');
            const navChats = document.getElementById('nav-chats');
            const navContacts = document.getElementById('nav-contacts');

            if (tab === 'chats') {
                chatsTab.classList.remove('hidden');
                contactsTab.classList.add('hidden');
                navChats.classList.add('bg-blue-700');
                navContacts.classList.remove('bg-blue-700');
                loadChats();
            } else {
                chatsTab.classList.add('hidden');
                contactsTab.classList.remove('hidden');
                navContacts.classList.add('bg-blue-700');
                navChats.classList.remove('bg-blue-700');
                loadContactsData();
            }
        }

        // Tải danh sách bạn bè đã kết bạn để nhắn tin
        async function loadChats() {
            const chatListEl = document.getElementById('chat-list');
            
            // Lấy danh sách quan hệ bạn bè đã accepted
            const { data: reqs } = await supabaseClient
                .from('friend_requests')
                .select('*')
                .eq('status', 'accepted')
                .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`);

            if (!reqs || reqs.length === 0) {
                chatListEl.innerHTML = `<div class="p-4 text-center text-sm text-gray-400">Chưa có bạn bè nào.<br>Hãy sang tab danh bạ để kết bạn nhé!</div>`;
                return;
            }

            let friendIds = reqs.map(r => r.sender_id === currentUser.id ? r.receiver_id : r.sender_id);
            const { data: friends } = await supabaseClient.from('custom_users').select('*').in('id', friendIds);

            let html = '';
            if (friends) {
                friends.forEach(f => {
                    html += `
                        <div onclick="selectChat('${f.id}', '${escapeHtml(f.display_name)}')" id="chat-item-${f.id}" class="flex items-center p-3 hover:bg-gray-100 cursor-pointer border-b">
                            <div class="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold mr-3">${f.display_name.charAt(0).toUpperCase()}</div>
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm">${escapeHtml(f.display_name)}</h4>
                                <p class="text-xs text-green-500">Nhấn để nhắn tin</p>
                            </div>
                        </div>
                    `;
                });
            }
            chatListEl.innerHTML = html;
        }

        // Tìm kiếm user để kết bạn
        async function searchUser() {
            const query = document.getElementById('search-user-input').value.trim();
            const container = document.getElementById('contacts-container');
            if (!query) return;

            const { data: users } = await supabaseClient.from('custom_users').select('*').ilike('username', `%${query}%`);
            
            let html = `<h4 class="text-xs font-bold text-gray-400 uppercase">Kết quả tìm kiếm</h4>`;
            if (!users || users.length === 0) {
                html += `<p class="text-sm text-gray-500">Không tìm thấy người dùng.</p>`;
            } else {
                users.forEach(u => {
                    if (u.id !== currentUser.id) {
                        html += `
                            <div class="flex items-center justify-between p-2 bg-gray-50 rounded-lg border">
                                <div class="flex items-center space-x-2">
                                    <div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-sm">${u.display_name.charAt(0).toUpperCase()}</div>
                                    <span class="text-sm font-bold text-gray-700">${escapeHtml(u.display_name)}</span>
                                </div>
                                <button onclick="sendFriendRequest('${u.id}')" class="bg-blue-600 text-white text-xs px-3 py-1 rounded hover:bg-blue-700">Kết bạn</button>
                            </div>
                        `;
                    }
                });
            }
            loadPendingRequests(html);
        }

        async function sendFriendRequest(receiverId) {
            // Kiểm tra xem đã gửi lời mời hoặc đã kết bạn chưa
            const { data: existing } = await supabaseClient
                .from('friend_requests')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`);

            if (existing && existing.length > 0) {
                alert('Đã có lời mời kết bạn hoặc đã là bạn bè từ trước!');
                return;
            }

            const { error } = await supabaseClient.from('friend_requests').insert({
                sender_id: currentUser.id,
                receiver_id: receiverId,
                status: 'pending'
            });

            if (!error) {
                alert('Đã gửi lời mời kết bạn thành công!');
                loadContactsData();
            }
        }

        // Tải danh sách lời mời kết bạn đang chờ xử lý
        async function loadContactsData(customHtml = '') {
            const container = document.getElementById('contacts-container');
            
            const { data: requests } = await supabaseClient
                .from('friend_requests')
                .select('*')
                .eq('receiver_id', currentUser.id)
                .eq('status', 'pending');

            let html = customHtml + `<h4 class="text-xs font-bold text-gray-400 uppercase mt-4">Lời mời kết bạn (${requests ? requests.length : 0})</h4>`;
            
            if (requests && requests.length > 0) {
                for (let req of requests) {
                    const { data: sender } = await supabaseClient.from('custom_users').select('*').eq('id', req.sender_id).single();
                    if (sender) {
                        html += `
                            <div class="flex items-center justify-between p-2 bg-blue-50 rounded-lg border">
                                <span class="text-sm font-bold text-gray-700">${escapeHtml(sender.display_name)}</span>
                                <div class="space-x-1">
                                    <button onclick="respondRequest('${req.id}', 'accepted')" class="bg-green-600 text-white text-xs px-2 py-1 rounded hover:bg-green-700">Đồng ý</button>
                                    <button onclick="respondRequest('${req.id}', 'rejected')" class="bg-red-500 text-white text-xs px-2 py-1 rounded hover:bg-red-600">Từ chối</button>
                                </div>
                            </div>
                        `;
                    }
                }
            } else {
                html += `<p class="text-sm text-gray-500">Không có lời mời kết bạn nào.</p>`;
            }
            container.innerHTML = html;
        }

        async function loadPendingRequests(extraHtml) {
            loadContactsData(extraHtml);
        }

        async function respondRequest(reqId, status) {
            await supabaseClient.from('friend_requests').update({ status }).eq('id', reqId);
            loadContactsData();
        }

        function selectChat(recipientId, recipientName) {
            currentRecipient = { id: recipientId, name: recipientName };
            
            document.querySelectorAll('#chat-list > div').forEach(el => el.classList.remove('bg-blue-50'));
            const activeEl = document.getElementById(`chat-item-${recipientId}`);
            if (activeEl) activeEl.classList.add('bg-blue-50');

            document.getElementById('no-chat-selected').classList.add('hidden');
            document.getElementById('active-chat').classList.remove('hidden');
            document.getElementById('current-chat-name').innerText = recipientName;
            document.getEle
