<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Game - Loading & Custom Background</title>
    <!-- Thêm thư viện Supabase JS từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        /* Lớp phủ tối để chữ nổi bật hơn khi có ảnh nền */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* --- MÀN HÌNH LOADING --- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0919;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #00dbde;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-text {
            font-size: 1.2rem;
            color: #00dbde;
            letter-spacing: 1px;
        }

        /* --- MENU CHÍNH --- */
        .menu-container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(252, 0, 255, 0.3);
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 220px;
            margin: 0 auto;
        }

        .btn {
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background: linear-gradient(45deg, #00dbde, #fc00ff);
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(252, 0, 255, 0.4);
        }

        /* --- KHU VỰC QUẢN LÝ ẢNH NỀN (XÓA ĐI SAU KHI DÙNG XONG) --- */
        .admin-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 0.9rem;
        }
        .admin-panel input {
            color: #fff;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Màn hình Loading -->
    <div id="loading-screen">
        <div class="loader-spinner"></div>
        <div id="loading-text">Đang tải tài nguyên game... 0%</div>
    </div>

    <!-- Lớp phủ nền -->
    <div class="overlay"></div>

    <!-- Màn hình Menu chính -->
    <div class="menu-container" id="main-menu">
        <h1>GAME CỦA TÔI</h1>
        <p class="subtitle">HTML5 Web Game Project</p>
        <div class="menu-buttons">
            <button class="btn" onclick="startGame()">Chơi Ngay</button>
            <button class="btn" onclick="openSettings()">Cài Đặt</button>
            <button class="btn" onclick="openCredits()">Thông Tin</button>
        </div>
    </div>

    <!-- PHẦN UPLOAD ẢNH NỀN SUPABASE -->
    <div class="admin-panel">
        <label>Đổi ảnh nền game (Supabase):</label><br>
        <input type="file" id="bgInput" accept="image/*" onchange="uploadBackground(this)">
    </div>

    <script>
        // --- CẤU HÌNH SUPABASE CỦA MÀY ---
        const SUPABASE_URL = 'ĐIỀN_SUPABASE_URL_VÀO_ĐÂY';
        const SUPABASE_ANON_KEY = 'ĐIỀN_SUPABASE_ANON_KEY_VÀO_ĐÂY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. Load ảnh nền đã lưu ngay khi khởi động
        const savedBg = localStorage.getItem('game_custom_bg');
        if (savedBg) {
            document.body.style.backgroundImage = `url('${savedBg}')`;
        }

        // 2. Xử lý màn hình Loading chạy mượt mà, không bị kẹt
        window.addEventListener('load', () => {
            let progress = 0;
            const loadingText = document.getElementById('loading-text');
            const loadingScreen = document.getElementById('loading-screen');

            const loadInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 5; // Tăng ngẫu nhiên từ 5-12%
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadInterval);
                    
                    // Ẩn màn hình loading
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }
                loadingText.innerText = `Đang tải tài nguyên game... ${progress}%`;
            }, 50); // Chạy nhanh hơn và mượt hơn
        });

        // 3. Hàm upload ảnh nền lên Supabase Storage
        async function uploadBackground(input) {
            const file = input.files[0];
            if (!file) return;

            alert("Đang upload ảnh lên Supabase, chờ xíu...");

            const fileName = `bg_${Date.now()}_${file.name}`;
            
            const { data, error } = await supabaseClient.storage
                .from('game-assets')
                .upload(fileName, file);

            if (error) {
                alert("Lỗi upload: " + error.message);
                return;
            }

            const { data: publicURLData } = supabaseClient.storage
                .from('game-assets')
                .getPublicUrl(fileName);

            const imageUrl = publicURLData.publicUrl;

            // Đổi nền ngay lập tức
            document.body.style.backgroundImage = `url('${imageUrl}')`;

            // Lưu vào LocalStorage
            localStorage.setItem('game_custom_bg', imageUrl);

            alert("Đổi ảnh nền thành công! Giờ mày có thể xóa đoạn code .admin-panel đi được rồi.");
        }

        function startGame() {
            alert("Chuẩn bị chuyển vào màn hình chơi game!");
        }

        function openSettings() {
            alert("Tính năng cài đặt đang phát triển!");
        }

        function openCredits() {
            alert("Được làm bởi bạn với HTML/CSS/JS & Supabase!");
        }
    </script>
</body>
</html>
