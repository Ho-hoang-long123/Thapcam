<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mạng Xã Hội - Đăng Nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <!-- KHUNG ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-container" class="bg-gray-800 p-8 rounded-2xl shadow-xl w-96 border border-gray-700">
        <h2 class="text-2xl font-bold mb-2 text-center text-indigo-400">Đăng nhập / Đăng ký</h2>
        <p class="text-sm text-gray-400 text-center mb-6">Nhập tên tài khoản và mật khẩu</p>
        
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Tên tài khoản</label>
                <input type="text" id="username" required 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white"
                    placeholder="Ví dụ: player123">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Mật khẩu</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white"
                    placeholder="••••••••">
            </div>

            <div id="error-msg" class="text-red-400 text-sm hidden"></div>

            <button type="submit" id="submit-btn"
                class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 transition font-semibold rounded-lg shadow-md">
                Tiếp tục
            </button>
        </form>
    </div>

    <!-- TRANG CHỦ -->
    <div id="dashboard-container" class="hidden bg-gray-100 text-gray-900 w-full min-h-screen flex flex-col">
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600">Xin chào, <span id="user-display"></span>!</h1>
            <button id="logout-btn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-semibold rounded-lg shadow transition">
                Đăng xuất
            </button>
        </header>

        <main class="flex-1 max-w-4xl w-full mx-auto p-6 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-lg font-bold mb-2">Bảng tin chung</h2>
                <p class="text-gray-600">Bạn đã đăng nhập vào hệ thống thành công!</p>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://qcgwmdsreduajcruktgm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QUA03gl4gHRsj1r95UPtTg_2fUvKIvF';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const authForm = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');
        const userDisplay = document.getElementById('user-display');
        const logoutBtn = document.getElementById('logout-btn');

        // Kiểm tra xem đã đăng nhập từ trước chưa
        const savedUser = localStorage.getItem('current_social_user');
        if (savedUser) {
            try {
                let userObj = JSON.parse(savedUser);
                if (userObj && userObj.username) {
                    showDashboard(userObj.username);
                }
            } catch (e) {
                localStorage.removeItem('current_social_user');
            }
        }

        // Xử lý khi bấm nút Đăng nhập / Đăng ký
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            submitBtn.textContent = "Đang xử lý...";
            submitBtn.disabled = true;
            
            const username = usernameInput.value.trim().toLowerCase();
            const password = passwordInput.value.trim();

            try {
                // Kiểm tra tài khoản có tồn tại trong database chưa
                let { data: users, error: selectError } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('username', username)
                    .limit(1);

                if (selectError) throw selectError;

                if (users && users.length > 0) {
                    // Đã có tài khoản -> Kiểm tra mật khẩu
                    let existingUser = users[0];
                    if (existingUser.password === password) {
                        localStorage.setItem('current_social_user', JSON.stringify(existingUser));
                        showDashboard(existingUser.username);
                    } else {
                        errorMsg.textContent = "Sai mật khẩu! Vui lòng nhập lại.";
                        errorMsg.classList.remove('hidden');
                    }
                } else {
                    // Chưa có tài khoản -> Tự động đăng ký mới luôn
                    let { data: newUsers, error: insertError } = await supabaseClient
                        .from('profiles')
                        .insert([{ username: username, password: password }])
                        .select();

                    if (insertError) throw insertError;

                    if (newUsers && newUsers.length > 0) {
                        localStorage.setItem('current_social_user', JSON.stringify(newUsers[0]));
                        showDashboard(newUsers[0].username);
                    }
                }
            } catch (err) {
                errorMsg.textContent = "Lỗi: " + (err.message || "Không thể kết nối cơ sở dữ liệu");
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.textContent = "Tiếp tục";
                submitBtn.disabled = false;
            }
        });

        function showDashboard(username) {
            authContainer.classList.add('hidden');
            dashboardContainer.classList.remove('hidden');
            userDisplay.textContent = username;
        }

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('current_social_user');
            dashboardContainer.classList.add('hidden');
            authContainer.classList.remove('hidden');
            usernameInput.value = '';
            passwordInput.value = '';
        });
    </script>
</body>
</html>
