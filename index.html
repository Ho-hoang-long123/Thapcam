<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thập Cẩm Network</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
--fb-bg: #f0f2f5;
--fb-blue: #1877f2;
--fb-blue-hover: #166fe5;
--fb-card: #ffffff;
--fb-text: #050505;
--fb-secondary: #65676b;
--fb-border: #ced0d4;
}
body { font-family: Helvetica, Arial, sans-serif; background: var(--fb-bg); color: var(--fb-text); margin: 0; padding: 0; }
/* Trang đăng nhập / đăng ký riêng biệt toàn màn hình */
#authPage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--fb-bg); display: flex; justify-content: center; align-items: center; z-index: 9999; box-sizing: border-box; }
.auth-container { display: flex; max-width: 980px; width: 100%; justify-content: space-between; align-items: center; padding: 20px; box-sizing: border-box; }
.auth-intro { flex: 1; padding-right: 40px; }
.auth-intro h1 { color: var(--fb-blue); font-size: 54px; margin: 0 0 10px 0; }
.auth-intro p { font-size: 24px; line-height: 28px; color: #1c1e21; margin: 0; }
.auth-box { background: white; padding: 20px; border-radius: 8px; width: 396px; box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1); text-align: center; box-sizing: border-box; }
.auth-input { width: 100%; padding: 14px 16px; margin-bottom: 12px; border: 1px solid var(--fb-border); border-radius: 6px; box-sizing: border-box; outline: none; font-size: 16px; background: #fff; }
.auth-input:focus { border-color: var(--fb-blue); box-shadow: 0 0 0 2px #e7f3ff; }
.avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--fb-blue); margin: 0 auto 12px auto; display: block; background: #ddd; }
.switch-auth { color: var(--fb-blue); cursor: pointer; font-size: 14px; margin-top: 15px; display: block; font-weight: 600; }
.switch-auth:hover { text-decoration: underline; }
/* Giao diện chính sau khi đăng nhập */
#mainApp { display: none; }
header { background: var(--fb-card); height: 56px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
header h2 { color: var(--fb-blue); margin: 0; font-size: 24px; font-weight: bold; }
.user-profile-badge { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; background: #e4e6eb; padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: background 0.2s; }
.user-profile-badge:hover { background: #d8dadf; }
.user-profile-badge img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
.container { max-width: 600px; margin: 15px auto; padding: 0 10px; box-sizing: border-box; }
.card { background: var(--fb-card); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); border: 1px solid rgba(0,0,0,0.05); }
/* Khung đăng bài */
.create-post-box textarea { width: 100%; border: none; outline: none; resize: none; font-size: 16px; padding: 8px 0; font-family: inherit; box-sizing: border-box; }
.create-post-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f0f2f5; padding-top: 10px; margin-top: 5px; }
.upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; cursor: pointer; color: var(--fb-secondary); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
.upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
.fb-btn { background: var(--fb-blue); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; width: 100%; box-sizing: border-box; }
.fb-btn:hover { background: var(--fb-blue-hover); }
/* Bài viết */
.post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.post-author { font-weight: bold; font-size: 15px; color: var(--fb-text); }
.post-time { font-size: 12px; color: var(--fb-secondary); }
.post-content { font-size: 15px; line-height: 1.5; margin-bottom: 10px; word-break: break-word; }
.post-media { width: 100%; max-height: 400px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
.post-actions-bar { display: flex; border-top: 1px solid #e4e6eb; border-bottom: 1px solid #e4e6eb; padding: 4px 0; margin-bottom: 8px; }
.action-option { flex: 1; background: none; border: none; color: var(--fb-secondary); font-weight: 600; padding: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 4px; font-size: 14px; }
.action-option:hover { background: #f2f2f2; }
/* Modal popup Profile / Đổi avatar */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 10000; box-sizing: border-box; }
.modal-box { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 380px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 1px solid #ddd; text-align: center; box-sizing: border-box; }
</style>
</head>
<body>
<!-- TRANG ĐĂNG NHẬP / ĐĂNG KÝ (RIÊNG BIỆT TOÀN MÀN HÌNH) -->
<div id="authPage">
<div class="auth-container">
<div class="auth-intro">
<h1>thapcam</h1>
<p>Kết nối và chia sẻ mọi khoảnh khắc cùng bạn bè trên Thập Cẩm Network.</p>
</div>
<div class="auth-box">
<h3 id="authTitle" style="color: var(--fb-blue); margin-top: 0; margin-bottom: 15px;">Đăng nhập Thập Cẩm</h3>
<!-- 1. FORM ĐĂNG NHẬP -->
<div id="loginForm">
<input type="text" id="loginUser" class="auth-input" placeholder="Tên tài khoản hoặc Email">
<input type="password" id="loginPass" class="auth-input" placeholder="Mật khẩu">
<button type="button" class="fb-btn" onclick="xuLyDangNhap()">Đăng nhập</button>
<span class="switch-auth" onclick="chuyenForm('forgot')">Quên mật khẩu?</span>
<hr style="border: none; border-top: 1px solid #dadde1; margin: 20px 0;">
<button type="button" class="fb-btn" style="background: #42b72a; width: auto; padding: 10px 16px;" onclick="chuyenForm('register')">Tạo tài khoản mới</button>
</div>
<!-- 2. FORM ĐĂNG KÝ -->
<div id="registerForm" style="display: none;">
<img id="previewImg" class="avatar-preview" src="https://via.placeholder.com/80" alt="Avatar">
<div style="margin-bottom: 12px;">
<label class="fb-btn" style="display:inline-block; width: auto; padding: 6px 12px; font-size: 13px; background: #e4e6eb; color: #050505;">
<i class="fa-solid fa-camera"></i> Chọn ảnh đại diện
<input type="file" id="regAvatarFile" accept="image/*" onchange="previewAvatar(event)" style="display:none;">
</label>
</div>
<input type="text" id="regName" class="auth-input" placeholder="Tên hiển thị của bạn">
<input type="email" id="regEmail" class="auth-input" placeholder="Địa chỉ Email">
<input type="password" id="regPass" class="auth-input" placeholder="Mật khẩu">
<button type="button" class="fb-btn" style="background: #42b72a;" onclick="xuLyDangKy()">Đăng ký tài khoản</button>
<span class="switch-auth" onclick="chuyenForm('login')">Đã có tài khoản? Đăng nhập ngay</span>
</div>
<!-- 3. FORM QUÊN MẬT KHẨU -->
<div id="forgotForm" style="display: none;">
<p style="font-size: 13px; color: var(--fb-secondary); margin-bottom: 12px;">Nhập Email tài khoản cần khôi phục mật khẩu mới.</p>
<input type="email" id="forgotEmail" class="auth-input" placeholder="Nhập địa chỉ Email của bạn">
<input type="password" id="newPass" class="auth-input" placeholder="Nhập mật khẩu mới">
<button type="button" class="fb-btn" style="background: #fa383e;" onclick="xuLyDoiMatKhauMoi()">Cập nhật mật khẩu mới</button>
<span class="switch-auth" onclick="chuyenForm('login')">Quay lại đăng nhập</span>
</div>
</div>
</div>
</div>
<!-- GIAO DIỆN CHÍNH (SAU KHI ĐĂNG NHẬP) -->
<div id="mainApp">
<!-- Header Facebook -->
<header>
<h2>thapcam</h2>
<div class="user-profile-badge" onclick="moProfileModal()" title="Bấm để xem hồ sơ / đổi Avatar">
<img id="headerAvatar" src="" alt="Ava">
<span id="headerName">Khách</span>
<i class="fa-solid fa-gear" style="font-size: 12px; color: var(--fb-secondary);"></i>
</div>
</header>
<div class="container">
<!-- Khung đăng bài -->
<div class="card create-post-box">
<textarea id="contentInput" placeholder="Bạn đang nghĩ gì thế?"></textarea>
<div id="selectedMediaPreview" style="font-size: 12px; color: var(--fb-secondary); margin-bottom: 5px;"></div>
<div class="create-post-actions">
<div class="upload-btn-wrapper">
<i class="fa-solid fa-image" style="color: #45bd62; font-size: 18px;"></i> Ảnh/Video
<input type="file" id="mediaFile" accept="image/*,video/*" onchange="previewMedia(event)">
</div>
<button type="button" class="fb-btn" style="width: auto;" onclick="dangBai()">Đăng bài</button>
</div>
</div>
<!-- Bảng tin -->
<div id="feed">Đang tải bảng tin...</div>
</div>
</div>
<!-- Modal Hồ sơ & Đổi Avatar -->
<div id="profileModal" class="modal-overlay">
<div class="modal-box">
<h3 style="color: var(--fb-blue); margin-top: 0;">Hồ sơ cá nhân</h3>
<img id="profileModalAvatar" class="avatar-preview" src="" alt="Avatar">
<div style="margin-bottom: 15px;">
<label class="fb-btn" style="display:inline-block; width: auto; padding: 6px 12px; font-size: 13px; background: #e4e6eb; color: #050505;">
<i class="fa-solid fa-camera"></i> Đổi ảnh đại diện mới
<input type="file" id="newAvatarFile" accept="image/*" onchange="previewNewAvatar(event)" style="display:none;">
</label>
</div>
<p style="font-weight: bold; font-size: 16px; margin: 5px 0 15px 0;" id="profileModalName"></p>
<button type="button" class="fb-btn" style="margin-bottom: 8px;" onclick="luuAvatarMoi()">Lưu thay đổi</button>
<button type="button" class="fb-btn" style="background: #e4e6eb; color: #050505; margin-bottom: 12px;" onclick="dongProfileModal()">Đóng</button>
<hr style="border: none; border-top: 1px solid #ddd; margin: 10px 0;">
<span class="switch-auth" style="color: #fa383e;" onclick="dangXuat()">
<i class="fa-solid fa-right-from-bracket"></i> Đăng xuất tài khoản
</span>
</div>
</div>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://qcgwmdsreduajcruktgm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QUA03gl4gHRsj1r95UPtTg_2fUvKIvF';
const { createClient } = supabase;
const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = JSON.parse(localStorage.getItem('thapcam_current_user')) || null;
let tempAvatarBase64 = '';
let tempNewAvatarBase64 = '';
let tempMediaBase64 = '';
window.addEventListener('DOMContentLoaded', function() {
kiemTraTrangThaiDangNhap();
});
function kiemTraTrangThaiDangNhap() {
if (currentUser) {
document.getElementById('authPage').style.display = 'none';
document.getElementById('mainApp').style.display = 'block';
hienThiUserHeader();
layBaiViet();
} else {
document.getElementById('authPage').style.display = 'flex';
document.getElementById('mainApp').style.display = 'none';
}
}
function chuyenForm(type) {
document.getElementById('loginForm').style.display = 'none';
document.getElementById('registerForm').style.display = 'none';
document.getElementById('forgotForm').style.display = 'none';
if (type === 'register') {
document.getElementById('registerForm').style.display = 'block';
document.getElementById('authTitle').innerText = 'Tạo tài khoản mới';
} else if (type === 'forgot') {
document.getElementById('forgotForm').style.display = 'block';
document.getElementById('authTitle').innerText = 'Khôi phục mật khẩu';
} else {
document.getElementById('loginForm').style.display = 'block';
document.getElementById('authTitle').innerText = 'Đăng nhập Thập Cẩm';
}
}
function previewAvatar(event) {
const file = event.target.files[0];
if (file) {
const reader = new FileReader();
reader.onload = function(e) {
tempAvatarBase64 = e.target.result;
document.getElementById('previewImg').src = tempAvatarBase64;
};
reader.readAsDataURL(file);
}
}
function previewNewAvatar(event) {
const file = event.target.files[0];
if (file) {
const reader = new FileReader();
reader.onload = function(e) {
tempNewAvatarBase64 = e.target.result;
document.getElementById('profileModalAvatar').src = tempNewAvatarBase64;
};
reader.readAsDataURL(file);
}
}
function previewMedia(event) {
const file = event.target.files[0];
if (file) {
const reader = new FileReader();
reader.onload = function(e) {
tempMediaBase64 = e.target.result;
document.getElementById('selectedMediaPreview').innerText = "Đã chọn: " + file.name;
};
reader.readAsDataURL(file);
}
}
async function xuLyDangKy() {
const name = document.getElementById('regName').value.trim();
const email = document.getElementById('regEmail').value.trim();
const password = document.getElementById('regPass').value.trim();
const avatar = tempAvatarBase64 || 'https://via.placeholder.com/150';
if (!name || !email || !password) {
alert('Vui lòng điền đầy đủ Tên, Email và Mật khẩu!');
return;
}
const { error } = await _supabase
.from('users')
.insert([{ name, email, password, avatar }]);
if (error) {
alert('Lỗi đăng ký (Email có thể đã tồn tại): ' + error.message);
} else {
alert('Đăng ký thành công! Hãy đăng nhập ngay.');
chuyenForm('login');
}
}
async function xuLyDangNhap() {
const userInput = document.getElementById('loginUser').value.trim();
const passwordInput = document.getElementById('loginPass').value.trim();
if (!userInput || !passwordInput) {
alert('Vui lòng nhập tài khoản và mật khẩu!');
return;
}
const { data, error } = await _supabase
.from('users')
.select('*')
.or(name.eq.${userInput},email.eq.${userInput})
.eq('password', passwordInput);
if (error || !data || data.length === 0) {
alert('Sai tên đăng nhập hoặc mật khẩu!');
return;
}
currentUser = data[0];
localStorage.setItem('thapcam_current_user', JSON.stringify(currentUser));
kiemTraTrangThaiDangNhap();
}
async function xuLyDoiMatKhauMoi() {
const email = document.getElementById('forgotEmail').value.trim();
const newPassword = document.getElementById('newPass').value.trim();
if (!email || !newPassword) {
alert('Vui lòng nhập đầy đủ Email và Mật khẩu mới!');
return;
}
const { data: checkUser, error: checkError } = await _supabase
.from('users')
.select('*')
.eq('email', email);
if (checkError || !checkUser || checkUser.length === 0) {
alert('Không tìm thấy tài khoản với email này!');
return;
}
const { error: updateError } = await _supabase
.from('users')
.update({ password: newPassword })
.eq('email', email);
if (updateError) {
alert('Lỗi cập nhật mật khẩu: ' + updateError.message);
} else {
alert('Đổi mật khẩu thành công! Hãy đăng nhập lại bằng mật khẩu mới.');
chuyenForm('login');
}
}
function moProfileModal() {
if (!currentUser) return;
document.getElementById('profileModalAvatar').src = currentUser.avatar || 'https://via.placeholder.com/80';
document.getElementById('profileModalName').innerText = currentUser.name;
document.getElementById('profileModal').style.display = 'flex';
tempNewAvatarBase64 = currentUser.avatar || '';
}
function dongProfileModal() {
document.getElementById('profileModal').style.display = 'none';
}
async function luuAvatarMoi() {
if (!currentUser) return;
if (!tempNewAvatarBase64 || tempNewAvatarBase64 === currentUser.avatar) {
alert('Vui lòng chọn ảnh đại diện mới!');
return;
}
const { error } = await _supabase
.from('users')
.update({ avatar: tempNewAvatarBase64 })
.eq('email', currentUser.email);
if (error) {
alert('Lỗi cập nhật Avatar: ' + error.message);
} else {
currentUser.avatar = tempNewAvatarBase64;
localStorage.setItem('thapcam_current_user', JSON.stringify(currentUser));
hienThiUserHeader();
dongProfileModal();
alert('Cập nhật ảnh đại diện thành công!');
layBaiViet();
}
}
function dangXuat() {
if (confirm('Bạn có muốn đăng xuất tài khoản không?')) {
localStorage.removeItem('thapcam_current_user');
currentUser = null;
kiemTraTrangThaiDangNhap();
}
}
function hienThiUserHeader() {
if (currentUser) {
document.getElementById('headerName').innerText = currentUser.name;
document.getElementById('headerAvatar').src = currentUser.avatar || 'https://via.placeholder.com/40';
}
}
async function dangBai() {
if (!currentUser) return;
const content = document.getElementById('contentInput').value.trim();
if (!content && !tempMediaBase64) {
alert('Vui lòng nhập nội dung hoặc chọn ảnh/video!');
return;
}
const { error } = await _supabase
.from('posts')
.insert([{
author: currentUser.name,
avatar: currentUser.avatar,
content: content,
media_url: tempMediaBase64,
likes: 0
}]);
if (error) {
alert('Lỗi khi đăng bài: ' + error.message);
} else {
document.getElementById('contentInput').value = '';
tempMediaBase64 = '';
document.getElementById('selectedMediaPreview').innerText = '';
layBaiViet();
}
}
async function layBaiViet() {
const { data, error } = await _supabase
.from('posts')
.select('*')
.order('created_at', { ascending: false });
const feedDiv = document.getElementById('feed');
if (error) {
feedDiv.innerHTML = '<div class="card">Lỗi tải dữ liệu: ' + error.message + '</div>';
return;
}
if (!data || data.length === 0) {
feedDiv.innerHTML = '<div class="card" style="text-align:center; color:gray;">Chưa có bài viết nào.</div>';
return;
}
let html = '';
data.forEach(post => {
let timeStr = post.created_at ? new Date(post.created_at).toLocaleString('vi-VN') : '';
let avatar = post.avatar || 'https://via.placeholder.com/40';
let mediaHtml = '';
if (post.media_url) {
if (post.media_url.startsWith('data:video')) {
mediaHtml = <video src="${post.media_url}" controls class="post-media"></video>;
} else {
mediaHtml = <img src="${post.media_url}" class="post-media" alt="Media">;
}
}
html += <div class="card"> <div class="post-header"> <img src="${avatar}" class="post-avatar" alt="Ava"> <div> <div class="post-author">${escapeHtml(post.author)}</div> <div class="post-time">${timeStr}</div> </div> </div> <div class="post-content">${escapeHtml(post.content)}</div> ${mediaHtml} <div class="post-actions-bar"> <button type="button" class="action-option" onclick="thichBai('${post.id}', ${post.likes || 0})"> <i class="fa-regular fa-thumbs-up"></i> Thích (${post.likes || 0}) </button> </div> </div>;
});
feedDiv.innerHTML = html;
}
async function thichBai(postId, currentLikes) {
await _supabase
.from('posts')
.update({ likes: currentLikes + 1 })
.eq('id', postId);
layBaiViet();
}
function escapeHtml(str) {
if (!str) return '';
return str.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
}
</script>
</body>
</html>
