<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đăng Nhập / Đăng Ký Supabase</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <!-- KHUNG ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-container" class="bg-gray-800 p-8 rounded-2xl shadow-xl w-96 border border-gray-700">
        <h2 class="text-2xl font-bold mb-2 text-center text-indigo-400">Chào mừng bạn!</h2>
        <p class="text-sm text-gray-400 text-center mb-6">Nhập tên tài khoản và mật khẩu để tiếp tục</p>
        
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Tên đăng nhập</label>
                <input type="text" id="username" required 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white"
                    placeholder="Ví dụ: player123">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Mật khẩu</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white"
                    placeholder="••••••••">
            </div>

            <div id="error-msg" class="text-red-400 text-sm hidden"></div>

            <button type="submit" id="submit-btn" 
                class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 transition font-semibold rounded-lg shadow-md">
                Tiếp tục
            </button>
        </form>
    </div>

    <!-- TRANG CHỦ (ẨN BAN ĐẦU) -->
    <div id="dashboard-container" class="hidden bg-gray-800 p-8 rounded-2xl shadow-xl w-[450px] border border-gray-700 text-center">
        <h1 class="text-3xl font-bold text-green-400 mb-2">Trang Chủ</h1>
        <p class="text-gray-300 mb-6">Xin chào, <span id="user-display" class="font-bold text-indigo-400"></span>!</p>
        <button id="logout-btn" 
            class="px-6 py-2 bg-red-600 hover:bg-red-700 transition font-semibold rounded-lg shadow-md">
            Đăng xuất
        </button>
    </div>

    <script>
        // Cấu hình kết nối Supabase
        const SUPABASE_URL = 'https://qcgwmdsreduajcruktgm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QUA03gl4gHRsj1r95UPtTg_2fUvKIvF';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const authForm = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');
        const userDisplay = document.getElementById('user-display');
        const logoutBtn = document.getElementById('logout-btn');

        // Kiểm tra xem đã đăng nhập trước đó chưa (lưu trong localStorage)
        const currentUser = localStorage.getItem('current_user');
        if (currentUser) {
            showDashboard(currentUser);
        }

        // Xử lý khi bấm nút Đăng nhập / Đăng ký chung 1 chỗ
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // Chuyển username thành dạng email giả để tương thích với cơ chế Auth của Supabase
            const fakeEmail = `${username.toLowerCase()}@customsystem.local`;

            // Thử đăng nhập trước
            let { data, error } = await supabaseClient.auth.signInWithPassword({
                email: fakeEmail,
                password: password
            });

            // Nếu đăng nhập lỗi (chưa có tài khoản hoặc sai mật khẩu), tiến hành đăng ký mới
            if (error) {
                let { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
                    email: fakeEmail,
                    password: password,
                    options: {
                        data: { display_name: username }
                    }
                });

                if (signUpError) {
                    errorMsg.textContent = "Lỗi: " + signUpError.message;
                    errorMsg.classList.remove('hidden');
                } else {
                    handleLoginSuccess(username);
                }
            } else {
                handleLoginSuccess(username);
            }
        });

        function handleLoginSuccess(username) {
            localStorage.setItem('current_user', username);
            showDashboard(username);
        }

        function showDashboard(username) {
            authContainer.classList.add('hidden');
            dashboardContainer.classList.remove('hidden');
            userDisplay.textContent = username;
        }

        // Đăng xuất tài khoản
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            localStorage.removeItem('current_user');
            dashboardContainer.classList.add('hidden');
            authContainer.classList.remove('hidden');
            usernameInput.value = '';
            passwordInput.value = '';
        });
    </script>
</body>
</html>
